    instances:
      project_id:
        location: [175.6, 26]
        orientation: N

  # required: top right corner marker
  gf180mcu_ws_ip__marker:
    gds:
      - dir::../ip/gf180mcu_ws_ip__marker/gds/gf180mcu_ws_ip__marker.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__marker/lef/gf180mcu_ws_ip__marker.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__marker/vh/gf180mcu_ws_ip__marker.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__marker/lib/gf180mcu_ws_ip__marker.lib
    instances:
      marker:
        location: ["expr::($DIE_AREA[2] - (245 + 36))", "expr::($DIE_AREA[3] - (245 + 36))"]
        orientation: N

  gf180mcu_ws_ip__logo:
    gds:
      - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
    instances:
      wafer_space_logo:
        location: [26, "expr::$DIE_AREA[3] - 169.25"]
        orientation: N

  # asic_rd analog hard macro: minimum comparator (views from
  # asic_rd/experiments/digital_on_top/make_macro.sh)
  comparator_min:
    gds:
      - dir::../ip/comparator_min/gds/comparator_min.gds
    lef:
      - dir::../ip/comparator_min/lef/comparator_min.lef
    vh:
      - dir::../ip/comparator_min/vh/comparator_min.v
    spice:
      - dir::../ip/comparator_min/spice/comparator_min.spice
    lib:
      "*":
        - dir::../ip/comparator_min/lib/comparator_min.lib
    instances:
      i_chip_core.cmp0:
        location: [1500, 1200]
        orientation: N

PDN_MACRO_CONNECTIONS:
- "i_chip_core.cmp0 VDD VSS vdd vss"

# Bond-pad nets to hand to the router (scripts/chip_flow.py). Empty: the
# bi_a pads expose a routable core-side ANA pin, so nothing is needed.
ANALOG_ROUTED_NETS: []
